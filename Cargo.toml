[package]
name = "hugemark"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
description = "Bounded, recoverable Markdown-to-PDF rendering for very large documents"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.53", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
url = "2"


fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
